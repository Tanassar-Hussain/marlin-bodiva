<mat-menu [xPosition]="'before'" #userActions="matMenu" class="mt-2">
    <button mat-menu-item>
        <span class="flex flex-col leading-none">
            <span>{{'Signed in as' | transloco}}</span>
            <span class="mt-1.5 text-md font-medium">{{user?.email}}</span>
        </span>
    </button>

    <mat-divider class="my-2"></mat-divider>
    <button mat-menu-item [ngStyle]="{'height' : 'auto'}" class="p-0" type="button" [disableRipple]="true"
        (click)="$event.stopPropagation()">
        <mat-expansion-panel hideToggle (opened)="clearUserProfile()" #profilePanel>
            <mat-expansion-panel-header>
                <mat-panel-title
                    [ngStyle]="{'justifyContent' : 'space-between','alignItems':'center','marginRight': '0'}">
                    <div>
                        <i class="fa fa-user mr-4" aria-hidden="true"></i>
                        <span>{{'Profile' | transloco}}</span>
                        <i class="fa fa-caret-down ml-2" aria-hidden="true"></i>
                    </div>
                    <button>
                        <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                    </button>
                </mat-panel-title>
            </mat-expansion-panel-header>



            <form action="" [ngStyle]="{'marginLeft':'14px'}" [formGroup]="userForm">

                <div class="form-group ">
                    <label for="username" class="ml-4" [ngStyle]="{'color':'#fff'}">{{'Name' | transloco}}</label>
                    <input type="text" class="form-control form-control-sm " id="username" [formControlName]="'name'"
                        [(ngModel)]="loggedInUser.name"
                        [ngStyle]="{'width':'fit-content','backgroundColor':'#364150','borderRadius':'15px','color': '#fff'}">
                    <div *ngIf="userForm.get('name').hasError('required')" class="text-red-600 text-sm ml-4 mt-1">
                        {{'Name' | transloco}} {{'Translation.is required' | transloco}}
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="ml-4" [ngStyle]="{'color':'#fff'}">{{'Email' | transloco}}</label>
                    <input type="email" class="form-control form-control-sm " id="email" aria-describedby="emailHelp"
                        [formControlName]="'email'" [(ngModel)]="loggedInUser.email"
                        [ngStyle]="{'width':'fit-content','backgroundColor':'#364150','borderRadius':'15px','color': '#d2d2d28f'}"
                        readonly>
                </div>

                <div class="form-group">
                    <label for="country" class="ml-4" [ngStyle]="{'color':'#fff'}">{{'Country' | transloco}}</label>
                    <input type="text" class="form-control form-control-sm " id="country" [(ngModel)]="countryName"
                        [formControlName]="'countryId'"
                        [ngStyle]="{'width':'fit-content','backgroundColor':'#364150','borderRadius':'15px','color': '#d2d2d28f'}"
                        readonly>
                </div>

                <div class="form-group">
                    <label for="exchange" class="ml-4" [ngStyle]="{'color':'#fff'}">{{'Exchange' | transloco}}</label>
                    <input type="text" class="form-control form-control-sm " id="exchange" [(ngModel)]="exchangeName"
                        [formControlName]="'exchangeId'"
                        [ngStyle]="{'width':'fit-content','backgroundColor':'#364150','borderRadius':'15px','color': '#d2d2d28f'}"
                        readonly>
                </div>

                <div class="form-group" [ngStyle]="{'width':'95%'}">
                    <label for="mobile-number" class="ml-4" [ngStyle]="{'color':'#fff'}">{{'Mobile Number' |
                        transloco}}</label>
                    <div class="input-group userUpdateForm"
                        [ngStyle]="{'display':'flex','alignItems':'center','borderRadius':'15px','backgroundColor':'#364150'}">
                        <div class="input-group-prepend mr-2 ">
                            <span class="input-group-text small p-2" id="basic-addon1">{{dialingCountryCode}}</span>
                        </div>
                        <input type="text" class="form-control form-control-sm" aria-label="mobile number"
                            [(ngModel)]="loggedInUser.mobile" [formControlName]="'mobile'"
                            aria-describedby="basic-addon1" id="mobile-number"
                            [ngStyle]="{'borderRadius':'0 15px 15px 0','backgroundColor' : 'transparent','color':'#fff'}">
                    </div>
                    <div *ngIf="userForm.get('mobile').hasError('required')" class="text-red-600 text-sm ml-4 mt-1">
                        {{'Mobile Number is required' | transloco}}
                    </div>
                    <div *ngIf="userForm.get('mobile').hasError('pattern')" class="text-red-600 text-sm ml-4 mt-1">
                        {{'Invalid Mobile Number' | transloco}}
                    </div>
                </div>

                <div class="row mr-2" [ngStyle]="{'justifyContent':'flex-end'}">
                    <button *ngIf="isWelcomeNoteApplicable" class="btn btn-md mr-2 updateHover" type="button"
                        (click)="showWelcomeNote()" [ngStyle]="{'backgroundColor' : '#13406A'}">{{'View Details' |
                        transloco}}</button>
                    <button class="btn btn-md mr-2 updateHover" type="button" (click)="onUpdate()"
                        [ngStyle]="{'backgroundColor' : '#13406A'}">{{'Update' | transloco}}</button>
                </div>
            </form>

        </mat-expansion-panel>
    </button>
    <mat-divider class="my-2"></mat-divider>
    <button mat-menu-item (click)="changePassword()" class="px-6" type="button" [disableRipple]="true">
        <div>
            <i class="fa fa-key mr-4" aria-hidden="true"></i>
            <span>{{'Change Password' | transloco}}</span>
        </div>
    </button>
    <mat-divider class="my-2"></mat-divider>
    <button mat-menu-item (click)="$event.stopPropagation()" type="button" [disableRipple]="true" class="px-6">
        <div class="w-full">
            <i class="fa fa-circle-o mr-4" aria-hidden="true"></i>
            <span>{{'User Status' | transloco}}</span>
            <div class="font-normal" style="float: right;font-size:13.4px;">
                <!-- <span *ngIf="isInvestor" class="text-green-500" ><i class="fa fa-check-circle-o mr-1" aria-hidden="true"></i>{{'Investor' | transloco}}</span> -->
                <span *ngIf="isInvestor" class="text-green-500"> <img style="margin-top:9px ;height: 2.2rem;"
                        src="assets/img/status-investor.png"></span>
                <span *ngIf="isMarlinUser" class="text-primary">{{'Marlin User' | transloco}}</span>
                <span *ngIf="isParticipant" class="text-primary ">{{'Participant' | transloco}}</span>
                <span *ngIf="isMarlinAdmin" class="text-primary ">{{'Admin' | transloco}}</span>
            </div>

        </div>
    </button>

    <!-- <button mat-menu-item>
        <span class="flex flex-col leading-none">
            <span class="c-pill c-pill--warning">Pending</span>
        </span>
    </button> -->
    <mat-divider class="my-2"></mat-divider>
    <button mat-menu-item (click)="signOut()">
        <div>
            <mat-icon [svgIcon]="'heroicons_outline:logout'"></mat-icon>
            <span>{{'Sign out' | transloco}}</span>
        </div>
    </button>
    <!-- <button mat-menu-item  (click)="signOut()" *ngIf="userType === 'MARLIN ADMIN'">
        <div>
            <mat-icon [svgIcon]="'heroicons_outline:logout'"></mat-icon>
            <span>{{'Sign out' | transloco}}</span>
        </div>
    </button> -->



</mat-menu>

<mat-menu class="user-status-menu" #userStatus="matMenu">
    <button mat-menu-item (click)="updateUserStatus('online')">
        <span class="w-4 h-4 mr-3 rounded-full bg-green-500"></span>
        <span>{{'Online' | transloco}}</span>
    </button>
    <button mat-menu-item (click)="updateUserStatus('away')">
        <span class="w-4 h-4 mr-3 rounded-full bg-amber-500"></span>
        <span>{{'Away' | transloco}}</span>
    </button>
    <button mat-menu-item (click)="updateUserStatus('busy')">
        <span class="w-4 h-4 mr-3 rounded-full bg-red-500"></span>
        <span>{{'Busy' | transloco}}</span>
    </button>
    <button mat-menu-item (click)="updateUserStatus('not-visible')">
        <span class="w-4 h-4 mr-3 rounded-full bg-gray-400"></span>
        <span>{{'Invisible' | transloco}}</span>
    </button>
</mat-menu>


<wj-popup #frmLoginPopup>
    <h4 class="modal-header">
        {{'Translation.Logout Alert' | transloco | uppercase}}
        <button type="button" tabindex="-1" class="close wj-hide">&times;</button>
    </h4>
    <div class="modal-body" style="background-color: #182131 !important; padding: 15px !important;">

        <h6>{{'Translation.Do you want to save your profile' | transloco}}</h6>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-info mx-1" (click)="signOut()">{{'Translation.Yes' | transloco}}</button>
        <button type="button" class="btn btn-danger mx-1" (click)="notSaveProfileCall()">{{'Translation.No' |
            transloco}}</button>
        <button type="button" class="btn btn-secondary mx-1" (click)="frmLoginPopup.hide(true)">{{'Translation.Cancel' |
            transloco}}</button>
    </div>
</wj-popup>
