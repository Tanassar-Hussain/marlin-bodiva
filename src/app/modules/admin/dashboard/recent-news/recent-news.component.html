<div class="pb-2 ml-5">
    <div class="flex flex-col w-full filter-article overflow-hidden" style="max-width:21rem;">
        <div *ngFor="let rss_data of (this.rssFilterData$ | async)" class="mb-1">
            <div class="font-sans  sm:text-md  xl:text-lg 3xl:text-xl"
                style="border-left-color:-webkit-linear-gradient( #334155, #0f172a);">
                <div class="mt-3 mb-1  text-primary"> {{rss_data.TITLE}} </div>
                <a (click)="openLink(rss_data.LINK)"
                    *ngIf="rss_data['MEDIA:CONTENT'] !== null && rss_data['MEDIA:CONTENT'] !== undefined">
                    <img class="object-cover h-30 cursor-pointer" [src]="rss_data['MEDIA:CONTENT'][0].$.URL"
                        alt="Card cover image">
                </a>
            </div>
        </div>
        <!-- <div *ngFor="let rss_data of (this.rssFilterData$ | async)" class="mb-1">
            <div class="font-sans  sm:text-md  xl:text-lg 3xl:text-xl"
                style="border-left-color:-webkit-linear-gradient( #334155, #0f172a);">
                <div class="mt-3 mb-1  text-primary"> {{rss_data.TITLE}} </div>
                <a (click)="openLink(rss_data.LINK)"
                    *ngIf="rss_data['MEDIA:CONTENT'] !== null && rss_data['MEDIA:CONTENT'] !== undefined">
                    <img class="h-30 cursor-pointer"  [src]="rss_data['MEDIA:CONTENT'][0].$.URL"
                        alt="Card cover image">
                </a>
            </div>
        </div> -->
        <div class="mt-2">
            <span *ngIf="hasMore && hasNews" class="flex justify-end">
                <button type="button" (click)="showMore()"
                    class="font-sans  sm:text-md  xl:text-lg 3xl:text-xl text-primary">{{'Translation.Show More' |
                    translate}}<i class="ml-1 fa fa-sort-desc" aria-hidden="true"></i></button>
            </span>
            <span *ngIf="!hasMore && hasNews" class="flex justify-end">
                <button type="button" (click)="showLess()"
                    class="font-sans  sm:text-md  xl:text-lg 3xl:text-xl text-primary">{{'Translation.Show less' |
                    translate}}<i class="ml-1 fa fa-sort-asc" aria-hidden="true"></i></button>
            </span>
        </div>

    </div>
</div>
