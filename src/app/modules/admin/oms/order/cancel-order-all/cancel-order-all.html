  <!-- Modal -->
  <div class="modal fade"     id="{{modalId}}" tabindex="-1" role="dialog" aria-labelledby="cancel-order-all" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-md" role="document">
      <div class="modal-content ">
        <div class="modal-header">
            <button type="button" class="close" (click)="onClose()">&times;</button>
            <h4 class="modal-title"><span class="fw-semi-bold">{{ 'Translation.Cancel Order' | translate }}</span>
                <span style="font-size: 11px;" class="text-success" *ngIf="tradeType === actualTrade"> -  {{'Translation.Actual Trade' | translate}}</span>
                <span style="font-size: 11px;" class="text-blue" *ngIf="tradeType === virtualTrde"> -  {{'Translation.Virtual Trade' | translate}}</span>
            </h4>
          </div>
        <div class="modal-body">
            <!------------------------Tabs Bar Start--------------------------->

               <div class="row">
                <div class="col-md-12">
                <ul class="ml-3 mb-0 mt-3" style="display: flex;">
                 <li  class="tabsBtns" (click)="changeAssetClass(assetClassEquities)" *ngIf="authService.isAuhtorized(authService.OM_EQUITY_ORDER_CANCEL)" #changeEquity
                 [class.tabsBtnsActive]="selectedAssetClass === assetClassEquities"><a ><span [class.tabsBtnsTextActive]="selectedAssetClass === assetClassEquities" class="tabsBtnsText">{{'EQUITIES' | translate }}</span></a></li>
                 <li  class="tabsBtns" (click)="changeAssetClass(assetClassBonds)" #changeBonds
                  *ngIf="authService.isAuhtorized(authService.OM_BOND_ORDER_CANCEL) && this.tradeType === actualTrade"  [class.tabsBtnsActive]="selectedAssetClass === assetClassBonds"><a  ><span [class.tabsBtnsTextActive]="selectedAssetClass === assetClassBonds" class="tabsBtnsText">{{'BONDS' | translate }}</span></a></li>
                  <li class="tabsBtns" (click)="changeAssetClass(assetClassETFs)" [class.tabsBtnsActive]="selectedAssetClass === assetClassETFs" *ngIf="tradeType === actualTrade" #changeETFs>
                    <a><span class="tabsBtnsText" [class.tabsBtnsTextActive]="selectedAssetClass === assetClassETFs">ETFs</span></a>
                </li>
                </ul>
            </div>
            </div>
                 <!------------------------Tabs Bar End--------------------------->
               <div class="row">
                  <div class="col-md-12">
                          
                                    <order-cancel [class.displayNone]="(selectedAssetClass === assetClassBonds || selectedAssetClass === assetClassETFs)"></order-cancel>
                                    <bond-order-cancel [class.displayNone]="(selectedAssetClass === assetClassEquities || selectedAssetClass === assetClassETFs)"></bond-order-cancel>
                                    <etf-order-cancel [class.displayNone]="(selectedAssetClass === assetClassEquities || selectedAssetClass === assetClassBonds)"></etf-order-cancel>
                           
                  </div>
               </div>
        </div>
      </div>
    </div>
  </div>
