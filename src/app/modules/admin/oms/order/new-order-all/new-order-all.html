
<!-- Modal -->
  <div class="modal fade" id="{{modalId}}" tabindex="-1" role="dialog" aria-labelledby="new-order-all" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document" style="width: 850px; min-width : 850px">
      <div class="modal-content ">
        <div class="modal-header">
            <button type="button" class="close" (click)="onClose()" >&times;</button>
            <h4 class="modal-title"><span class="fw-semi-bold">{{ 'Translation.New Order' | translate }}</span>
             <span style="font-size: 11px;" class="text-success" *ngIf="tradeType === actualTrade"> -  {{'Translation.Actual Trade' | translate}}</span>
             <span style="font-size: 11px;" class="text-blue" *ngIf="tradeType === virtualTrde"> -  {{'Translation.Virtual Trade' | translate}}</span>
            </h4>
          </div>
        <div class="modal-body" style="padding-top: 5px;">
            <!------------------------Tabs Bar Start--------------------------->
               <div class="row">
                   <div class="col-md-9" style="border-right: 3px solid #2A3243;">
                   <ul class="ml-5 mb-0 mt-3" style="display: flex;">
                    <li  class="tabsBtns" #newEquity (click)="changeAssetClass(assetClassEquities)" *ngIf="authService.isAuhtorized(authService.OM_EQUITY_ORDER_NEW)" [class.tabsBtnsActive]="selectedAssetClass === assetClassEquities"><a ><span [class.tabsBtnsTextActive]="selectedAssetClass === assetClassEquities" class="tabsBtnsText">{{'EQUITIES' | translate }}</span></a></li>
                    <li  class="tabsBtns" #newBonds (click)="changeAssetClass(assetClassBonds)" *ngIf="authService.isAuhtorized(authService.OM_BOND_ORDER_NEW)" [class.tabsBtnsActive]="selectedAssetClass === assetClassBonds"><a  ><span [class.tabsBtnsTextActive]="selectedAssetClass === assetClassBonds" class="tabsBtnsText">{{'BONDS' | translate }}</span></a></li>
                    <li class="tabsBtns" #newETF (click)="changeAssetClass(assetClassETFs)"  *ngIf="authService.isAuhtorized(authService.OM_BOND_ORDER_NEW) || authService.isAuhtorized(authService.OM_EQUITY_ORDER_NEW)" [class.tabsBtnsActive]="selectedAssetClass === assetClassETFs "><a><span [class.tabsBtnsTextActive]="selectedAssetClass === assetClassETFs" class="tabsBtnsText">ETFs</span></a></li>
                   </ul>
            <!------------------------Tabs Bar End--------------------------->

              <div order-new-nav [class.displayNone]="(selectedAssetClass === assetClassBonds || selectedAssetClass === assetClassETFs)" [sharedData]="selectedAssetClassData" [sharedSide]="selectedAssetClassSide" [sharedIndex]="loadIndex"></div>
              <div [class.displayNone]="(selectedAssetClass === assetClassEquities || selectedAssetClass === assetClassETFs)" bond-order-new [sharedData]="selectedAssetClassData" [sharedSide]="selectedAssetClassSide" [sharedIndex]="loadIndex"></div>
              <div order-new-etf [class.displayNone]="(selectedAssetClass === assetClassEquities || selectedAssetClass === assetClassBonds)" #newOrderETF [sharedData]="selectedAssetClassData" [sharedSide]="selectedAssetClassSide" [sharedIndex]="loadIndex"> </div>
         
               </div>

              <ng-container>
                <div class="col-md-3" style="height: max-content; padding-left: 10px;">
                    <order-book-shared></order-book-shared>
                 </div>
              </ng-container>







        </div>


      </div>
    </div>
  </div>
</div>
