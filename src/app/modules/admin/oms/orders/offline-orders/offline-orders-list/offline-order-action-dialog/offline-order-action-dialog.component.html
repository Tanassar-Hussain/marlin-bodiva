<div class="modal fade" id="{{modalId}}" tabindex="-1" role="dialog" aria-labelledby="cancel-order-all"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-md" role="document">
        <div class="modal-content ">
            <div class="modal-header">
                <button type="button" class="close" (click)="onClose()">&times;</button>
                <h4 class="modal-title"><span class="fw-semi-bold">{{ 'Offline Order' | translate }}</span>
                    <span style="font-size: 11px;" class="text-success"
                          *ngIf="tradeType === actualTrade"> -  {{ 'Translation.Actual Trade' | translate }}</span>
                    <span style="font-size: 11px;" class="text-blue"
                          *ngIf="tradeType === virtualTrade"> -  {{ 'Translation.Virtual Trade' | translate }}</span>
                </h4>
            </div>
            <div class="modal-body">
                <!------------------------Tabs Bar Start--------------------------->

                <div class="row">
                    <div class="col-md-12">
                        <ul class="ml-3 mb-0 mt-3" style="display: flex;">
                            <li class="tabsBtns"
                                [class.tabsBtnsActive]="selectedAssetClass === 'equities'">
                                <a><span [class.tabsBtnsTextActive]="selectedAssetClass === 'equities'"
                                         class="tabsBtnsText">{{ 'Equities' | translate | uppercase }}</span></a>
                            </li>
                            <li class="tabsBtns"
                                [class.tabsBtnsActive]="selectedAssetClass === 'bonds'">
                                <a><span [class.tabsBtnsTextActive]="selectedAssetClass === 'bonds'"
                                         class="tabsBtnsText">{{ 'Bonds' | translate | uppercase }}</span></a>
                            </li>
                            <li class="tabsBtns"
                                [class.tabsBtnsActive]="selectedAssetClass === 'etf'">
                                <a><span [class.tabsBtnsTextActive]="selectedAssetClass === 'etf'"
                                         class="tabsBtnsText">{{ 'ETFs' | translate | uppercase }}</span></a>
                            </li>
                        </ul>
                    </div>
                </div>
                <!------------------------Tabs Bar End--------------------------->

                <ng-container *ngIf="selectedAssetClass !== 'bonds'; else bondTemplate">
                    <app-equity-etf-offline-order-action  (refresh)="refresh.emit(true)" (hide)="isModalVisible = false" *ngIf="isModalVisible && selectedAssetClass !== 'bonds'"
                                                         [modalId]="modalId" [order]="order"
                                                         [action]="action"></app-equity-etf-offline-order-action>
                </ng-container>
                <ng-template #bondTemplate>
                    <app-bond-offline-order-action  (refresh)="refresh.emit(true)" (hide)="isModalVisible = false" *ngIf="isModalVisible && selectedAssetClass === 'bonds'"
                                                          [modalId]="modalId" [order]="order"
                                                          [action]="action"></app-bond-offline-order-action>
                </ng-template>
            </div>
        </div>
    </div>
</div>
