<div class="row" style="width: 100%">
    <div class="col-lg-12 col-md-offset-0 col-xs-12 widget-container">
        <ul class="mb-0 ml-5 mt-3" style="display: flex;">
            <li class="tabsBtns" (click)="selectedAssetClass= 'equities'"
                [class.tabsBtnsActive]="selectedAssetClass === 'equities'">
                <a>
                    <span [class.tabsBtnsTextActive]="selectedAssetClass === 'equities'"
                          class="tabsBtnsText">{{ 'Equities' | translate | uppercase }}</span>
                </a>
            </li>
          <li class="tabsBtns" (click)="selectedAssetClass='bonds'"
                [class.tabsBtnsActive]="selectedAssetClass === 'bonds'">
                <a>
                    <span [class.tabsBtnsTextActive]="selectedAssetClass === 'bonds'"
                          class="tabsBtnsText">{{ 'Bonds' | translate | uppercase }}</span>
                </a>
            </li>
              <li class="tabsBtns" (click)="selectedAssetClass='etf'"
                [class.tabsBtnsActive]="selectedAssetClass === 'etf'">
                <a>
                    <span [class.tabsBtnsTextActive]="selectedAssetClass === 'etf'"
                          class="tabsBtnsText">{{ 'ETFs' | translate }}</span>
                </a>
            </li>
        </ul>

        <app-pending-orders-list *ngIf="selectedAssetClass === 'equities'" [selectedType]="selectedAssetClass"></app-pending-orders-list>

        <app-pending-orders-list *ngIf="selectedAssetClass === 'bonds'" [selectedType]="selectedAssetClass"></app-pending-orders-list>

        <app-pending-orders-list *ngIf="selectedAssetClass === 'etf'" [selectedType]="selectedAssetClass"></app-pending-orders-list>

    </div>
</div>
