<div class="row" style="width: 100%">
    <div class="col-lg-12 col-md-offset-0 col-xs-12 widget-container">
        <ul class="mb-0 ml-5 mt-3" style="display: flex;">
            <li (click)="selectedAssetClass= 'equities'" [class.tabsBtnsActive]="selectedAssetClass === 'equities'"
                class="tabsBtns">
                <a>
                    <span [class.tabsBtnsTextActive]="selectedAssetClass === 'equities'"
                          class="tabsBtnsText">{{ 'Equities' | translate | uppercase }}</span>
                </a>
            </li>
            <li (click)="selectedAssetClass='bonds'" [class.tabsBtnsActive]="selectedAssetClass === 'bonds'"
                class="tabsBtns">
                <a>
                    <span [class.tabsBtnsTextActive]="selectedAssetClass === 'bonds'"
                          class="tabsBtnsText">{{ 'Bonds' | translate | uppercase }}</span>
                </a>
            </li>
            <li (click)="selectedAssetClass='etf'" [class.tabsBtnsActive]="selectedAssetClass === 'etf'"
                class="tabsBtns">
                <a>
                    <span [class.tabsBtnsTextActive]="selectedAssetClass === 'etf'"
                          class="tabsBtnsText">{{ 'ETFs' | translate }}</span>
                </a>
            </li>
        </ul>

        <app-rejected-orders-list *ngIf="selectedAssetClass === 'equities'" [selectedType]="selectedAssetClass" [assetId]="1"></app-rejected-orders-list>

        <app-rejected-orders-list *ngIf="selectedAssetClass === 'bonds'" [selectedType]="selectedAssetClass" [assetId]="5"></app-rejected-orders-list>

        <app-rejected-orders-list *ngIf="selectedAssetClass === 'etf'" [selectedType]="selectedAssetClass" [assetId]="6"></app-rejected-orders-list>

    </div>
</div>
