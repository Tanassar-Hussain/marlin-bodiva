<div class="row mb-4" style="width: 100%; margin-left: -17px;">
    <div class="col-sm-12 widget-container">

        <ul class="mb-0  " style="display: flex;">

            <li *ngIf="isBond" class="tabsBtnsDashboard mr-1" (click)="type='overview'"
                [class.tabsBtnsActiveDashboard]="type === 'overview'">
                <a><span [class.tabsBtnsTextActiveDashbaord]="type === 'overview'" class="tabsBtnsTextDashbaord">
                        {{'Translation.Overview' | translate}}
                    </span>
                </a>
            </li>
            <li class="tabsBtnsDashboard mr-1" (click)="type='tradingDetails'"
                [class.tabsBtnsActiveDashboard]="type === 'tradingDetails'">
                <a><span [class.tabsBtnsTextActiveDashbaord]="type === 'tradingDetails'" class="tabsBtnsTextDashbaord">
                        {{'Translation.Trading Details' | translate}}
                    </span>
                </a>
            </li>
            <li class="tabsBtnsDashboard mr-1" (click)="type='trades'"
                [class.tabsBtnsActiveDashboard]="type === 'trades'">
                <a><span [class.tabsBtnsTextActiveDashbaord]="type === 'trades'" class="tabsBtnsTextDashbaord">
                        {{'Translation.Trades' | translate}}
                    </span>
                </a>
            </li>
            <li *ngIf="isBond" class="tabsBtnsDashboard mr-1" (click)="type='schedule'"
                [class.tabsBtnsActiveDashboard]="type === 'schedule'">
                <a><span [class.tabsBtnsTextActiveDashbaord]="type === 'schedule'" class="tabsBtnsTextDashbaord">
                        {{'Translation.Schedule' | translate}}
                    </span>
                </a>
            </li>

        </ul>

        <div *ngIf="type === 'overview'" class="dashboardGrid">
            <symbol-overview [updatedSecurityDetails]="updateSecurityDetails" [inheritedSymbolDetails]="sharedOrderData" [inheritedSymbolDetailWithID]="symbolDetailsWithID"></symbol-overview>
        </div>

        <div *ngIf="type === 'tradingDetails'" class="dashboardGrid">
            <symbol-trading-details [inheritedSymbolDetails]="sharedOrderData"></symbol-trading-details>
        </div>

        <div *ngIf="type === 'trades'" class="dashboardGrid">
            <symbol-trades [inheritedSymbolDetails]="symbolDetailsWithID"></symbol-trades>
        </div>

        <div *ngIf="type === 'schedule'" class="dashboardGrid">
            <symbol-schedule [inheritedSymbolDetails]="symbolDetailsWithID"></symbol-schedule>
        </div>
    </div>

</div>
